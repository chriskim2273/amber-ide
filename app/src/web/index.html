<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amber-ide</title>
    <!-- `viewport-fit=cover` lets the page paint under the notch and home
         indicator; the chrome pads itself back with env(safe-area-inset-*).

         Browser pinch-zoom is deliberately LEFT ENABLED. An earlier draft set
         `user-scalable=no` to make room for app-owned pinch (font size on a
         borrowed pane, CSS scale on a tile) — but that pinch is not built, so
         disabling the browser's would leave a phone with no way to zoom at
         all. Re-evaluate only if app-owned pinch actually lands. -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Standalone launch from the home screen on iOS; Android reads the
         manifest's display field instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="amber" />
    <meta name="theme-color" content="#0c0c0f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <style>html, body, #root { margin: 0; height: 100%; background: #000; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
